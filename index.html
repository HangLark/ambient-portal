<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101113" />
    <style>
      :root { --page-bg: #101113; background: var(--page-bg); color-scheme: dark; }
      :root[data-theme='light'] { --page-bg: #f7f7f9; color-scheme: light; }
    </style>
    <script>
      // Apply the saved appearance before loading the app, so reloads do not flash the other theme.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('ambient-portal.theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch { /* Storage is optional. */ }
        const root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--page-bg').trim();
      })();
    </script>
    <meta name="description" content="遥·窗 Ambient Portal — 配合远程桌面，看见现场、听见环境。Live camera preview and ambient sound with your remote desktop app." />
    <link rel="icon" type="image/svg+xml" href="/portal.svg" />
    <title>遥·窗 | Ambient Portal</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ambient Portal needs JavaScript to access your camera and microphone. / <span lang="zh-CN">遥·窗需要启用 JavaScript，才能使用摄像头和麦克风。</span></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
